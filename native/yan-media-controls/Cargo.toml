[package]
name = "yan-media-controls"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["tokio_rt", "napi9"] }
napi-derive = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
image = "0.25"

[build-dependencies]
napi-build = "2"

# Windows: WinRT SMTC + Win32 DWM 任务栏缩略图
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Media_Playback",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
]

# Linux: MPRIS D-Bus
[target.'cfg(target_os = "linux")'.dependencies]
# 0.10 起 edition 升为 2024；zbus 默认走 async-std，需显式启用 tokio feature
# 以配合本 crate 的 tokio runtime（见 sys_media/linux.rs 的 current_thread runtime）。
mpris-server = { version = "0.10", features = ["tokio"] }
tempfile = "3"

# macOS: MPNowPlayingInfoCenter
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
objc2-app-kit = "0.3"
