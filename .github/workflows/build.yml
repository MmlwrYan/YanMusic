name: Build YanMusic Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            electron_builder_args: ''
            artifact_name: YanMusic-macOS-arm64
            artifact_glob: |
              release/YanMusic-*.zip
              release/YanMusic-*.dmg
              release/latest-mac.yml
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            electron_builder_args: '--mac --x64'
            artifact_name: YanMusic-macOS-x64
            artifact_glob: |
              release/YanMusic-*.zip
              release/YanMusic-*.dmg
          - os: ubuntu-22.04
            rust_target: ''
            electron_builder_args: ''
            artifact_name: YanMusic-Linux-x64
            artifact_glob: |
              release/YanMusic-*.AppImage
              release/YanMusic-*.deb
              release/YanMusic-*.pacman
              release/YanMusic-*.pkg.tar.zst
              release/YanMusic-*.rpm
              release/YanMusic-*.tar.gz
              release/latest-linux.yml
          - os: ubuntu-22.04-arm
            rust_target: ''
            electron_builder_args: '--linux --arm64'
            artifact_name: YanMusic-Linux-arm64
            artifact_glob: |
              release/YanMusic-*.AppImage
              release/YanMusic-*.deb
              release/YanMusic-*.pacman
              release/YanMusic-*.pkg.tar.zst
              release/YanMusic-*.rpm
              release/YanMusic-*.tar.gz
              release/latest-linux-arm64.yml
          - os: windows-latest
            rust_target: ''
            electron_builder_args: '--win --x64'
            artifact_name: YanMusic-Windows-x64
            artifact_glob: |
              release/YanMusic-*-Windows-Setup-x64.exe
              release/latest.yml
          - os: windows-11-arm
            rust_target: ''
            electron_builder_args: '--win --arm64'
            artifact_name: YanMusic-Windows-arm64
            artifact_glob: |
              release/YanMusic-*-Windows-Setup-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # V4-05（v1.4.0）：GUI 冒烟要在无显示器的 runner 上**真的启动** Electron，
          # 故追加 xvfb 与几个必需的运行库（缺 libgbm/libnss3 会让 Electron 直接报
          # 「error while loading shared libraries」而根本起不来）。
          # libasound2 在 Ubuntu 24.04 改名为 libasound2t64，故做一次回退。
          set -e
          sudo apt-get update
          BASE="libarchive-tools libasound2-dev libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6 xdg-utils xvfb libgbm1"
          if ! sudo apt-get install -y $BASE libasound2t64; then
            echo "libasound2t64 不可用，回退到 libasound2"
            sudo apt-get install -y $BASE libasound2
          fi

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add Rust cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build native media controls addon
        working-directory: native/yan-media-controls
        shell: bash
        run: |
          npm install
          if [ -n "${{ matrix.rust_target }}" ]; then
            npx napi build --release --no-const-enum --target ${{ matrix.rust_target }}
          else
            npm run build
          fi

      - name: Build native mpv player addon
        working-directory: native/yan-mpv-player
        shell: bash
        run: |
          npm install
          if [ -n "${{ matrix.rust_target }}" ]; then
            npx napi build --release --no-const-enum --target ${{ matrix.rust_target }}
          else
            npm run build
          fi

      - name: Build native storage addon
        working-directory: native/yan-storage
        shell: bash
        run: |
          npm install
          if [ -n "${{ matrix.rust_target }}" ]; then
            npx napi build --release --no-const-enum --target ${{ matrix.rust_target }}
          else
            npm run build
          fi

      - name: Build native spectrum capture addon
        working-directory: native/yan-spectrum-capture
        shell: bash
        run: |
          npm install
          if [ -n "${{ matrix.rust_target }}" ]; then
            npx napi build --release --no-const-enum --target ${{ matrix.rust_target }}
          else
            npm run build
          fi

      - name: Check Rust workspace
        # V4-04（v1.4.0）：补 workspace 级 `cargo check`。
        #
        # 为什么现有 4 个 `napi build` 不够：它们各自只编译**自己那个 addon 目标**。
        # workspace 里那些未被任何 addon 目标引用的**代码路径**（例如某个 crate 的
        # 条件编译分支、仅被测试/示例引用的模块）不会被编译到 —— 也就是说
        # 「6 条腿全绿」并不覆盖 workspace 的整体可编译性。
        #
        # 本步骤代价很小（依赖已因上面的 addon 构建而就位，缓存命中），
        # 且顺带会把 `Cargo.toml` 的 resolver 警告暴露出来。
        shell: bash
        run: cargo check --workspace --release

      - name: Install server runtime dependencies
        working-directory: server
        shell: bash
        run: |
          # server 是外部子模块，其依赖锁定文件是 **pnpm-lock.yaml**（受子模块版本控制，
          # 覆盖全部 21 条声明依赖），而 **npm 不读 pnpm-lock.yaml** —— 也就是说
          # 这里每次构建都是按 ^x.y.z 重新解析，同一次 tag 在不同时间构建会得到不同产物。
          # 改用 pnpm install --frozen-lockfile --prod 即可复现（W-10，需联网验证后切换）。
          # 另：devDependencies(tsdown) 与 typescript@4.x 确有 peer 冲突，故运行时只装 --omit=dev。
          npm install --omit=dev --no-audit --no-fund --legacy-peer-deps

      - name: Remove server test files
        working-directory: server
        shell: bash
        run: find module -name '*.test.js' -delete

      - name: Prepare Rosetta 2 (macOS x64)
        if: matrix.rust_target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -e
          echo "runner arch: $(uname -m)"
          if [ "$(uname -m)" = "arm64" ]; then
            # arm64 runner 上需要 Rosetta 2 才能运行 x86_64 工具链
            if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "Rosetta 2 不可用，开始安装..."
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            /usr/bin/arch -x86_64 /usr/bin/true
            echo "Rosetta 2 OK，x86_64 环境: $(/usr/bin/arch -x86_64 /usr/bin/uname -m)"
          else
            echo "原生 x86_64 runner（macOS x64 任务在 macos-15-intel 上原生构建），无需 Rosetta 2"
          fi

      - name: Download libmpv library
        shell: bash
        env:
          # W-9：GitHub API 令牌经 env 传入（见下方 curl 处的说明）
          MPV_RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p build/mpv

          # 递归复制 dylib 依赖（macOS 专用）
          copy_dylibs_recursive() {
            local bin_or_lib="$1"
            local dest_dir="$2"
            local depth="${3:-0}"
            if [ "$depth" -gt 5 ]; then return; fi

            otool -L "$bin_or_lib" 2>/dev/null | awk '/\/opt\/homebrew|\/usr\/local/{print $1}' | while read -r lib; do
              local base_name
              base_name=$(basename "$lib")
              if [ -f "$dest_dir/$base_name" ]; then continue; fi
              if [ -f "$lib" ]; then
                cp "$lib" "$dest_dir/" 2>/dev/null || true
                # 递归处理这个 dylib 的依赖
                copy_dylibs_recursive "$dest_dir/$base_name" "$dest_dir" $((depth + 1))
              fi
            done
          }

          # 修复 macOS dylib 的加载路径，使用 @loader_path 相对路径
          fix_macos_rpaths() {
            local lib_dir="$1"

            # 修复每个 dylib 内部的依赖引用
            for dylib in "$lib_dir"/*.dylib; do
              [ -f "$dylib" ] || continue
              local dylib_name
              dylib_name=$(basename "$dylib")
              # 修复 dylib 的 install name
              install_name_tool -id "@loader_path/$dylib_name" "$dylib" 2>/dev/null || true
              # 修复 dylib 内部引用的其他 dylib
              otool -L "$dylib" | awk '/\/opt\/homebrew|\/usr\/local/{print $1}' | while read -r dep; do
                local dep_name
                dep_name=$(basename "$dep")
                if [ -f "$lib_dir/$dep_name" ]; then
                  install_name_tool -change "$dep" "@loader_path/$dep_name" "$dylib" 2>/dev/null || true
                fi
              done
            done

            echo "rpath fixup complete"
          }

          # Homebrew 依赖里可能包含无后缀 Mach-O（例如 Python.framework 的 Python）。
          # 不能只按 *.dylib 签名，否则 macOS 会在 dlopen 依赖链时杀掉进程。
          sign_macos_macho_dir() {
            local lib_dir="$1"
            local signed_count=0

            [ -d "$lib_dir" ] || return 0
            xattr -cr "$lib_dir" 2>/dev/null || true

            while IFS= read -r -d '' file_path; do
              if file "$file_path" | grep -q 'Mach-O'; then
                chmod u+w "$file_path" 2>/dev/null || true
                codesign --force --sign - --timestamp=none "$file_path"
                signed_count=$((signed_count + 1))
              fi
            done < <(find "$lib_dir" -type f -print0)

            echo "signed $signed_count macOS Mach-O files in $lib_dir"
          }

          verify_macos_macho_dir() {
            local lib_dir="$1"
            local verified_count=0

            [ -d "$lib_dir" ] || return 0

            while IFS= read -r -d '' file_path; do
              if file "$file_path" | grep -q 'Mach-O'; then
                codesign --verify --strict --verbose=2 "$file_path"
                verified_count=$((verified_count + 1))
              fi
            done < <(find "$lib_dir" -type f -print0)

            echo "verified $verified_count macOS Mach-O signatures in $lib_dir"
          }

          case "${{ matrix.rust_target }}:${{ matrix.os }}" in
            aarch64-apple-darwin:*)
              # macOS arm64: 使用原生 homebrew 安装 mpv
              brew install mpv
              MPV_PREFIX=$(brew --prefix mpv)
              cp "$MPV_PREFIX"/lib/libmpv*.dylib build/mpv/ 2>/dev/null || true
              for lib in build/mpv/libmpv*.dylib; do
                [ -f "$lib" ] || continue
                copy_dylibs_recursive "$lib" "build/mpv"
              done
              fix_macos_rpaths "build/mpv"
              sign_macos_macho_dir "build/mpv"
              verify_macos_macho_dir "build/mpv"
              echo "libmpv macOS arm64 prepared"
              echo "=== build/mpv directory ==="
              ls -la build/mpv/ | head -30
              ;;
            x86_64-apple-darwin:*)
              # macOS x64 任务运行在原生 Intel runner（macos-15-intel）上：Homebrew
              # 装在 /usr/local，`brew install mpv` 直接得到 x86_64 版 libmpv。
              # 重要：Homebrew 官方安装器已拒绝在 Apple Silicon 上安装 x86_64 版本
              # （"Homebrew on macOS is only supported on Apple Silicon processors!"），
              # 因此不再尝试在 arm64 runner 上现场安装 x86_64 Homebrew。
              echo "macOS x64 构建主机架构: $(uname -m)"
              if ! /usr/bin/arch -x86_64 /usr/bin/true; then
                echo "ERROR: 无法执行 x86_64 程序（Rosetta 2 不可用或 runner 架构异常）"
                echo "=== 诊断 ==="
                echo "uname -m      : $(uname -m)"
                echo "arch -x86_64  : $(/usr/bin/arch -x86_64 /usr/bin/true 2>&1 || true)"
                echo "Rosetta 进程  : $(/usr/bin/pgrep -x oahd >/dev/null 2>&1 && echo 'oahd running' || echo 'oahd not running')"
                exit 1
              fi
              if [ ! -x /usr/local/bin/brew ]; then
                echo "ERROR: 未找到 x86_64 Homebrew（/usr/local/bin/brew）"
                echo "       官方安装器已不支持在 Apple Silicon 上安装 x86_64 Homebrew，"
                echo "       请确认 macOS x64 任务运行在 macos-15-intel（原生 Intel）runner 上。"
                echo "=== 诊断 ==="
                echo "uname -m          : $(uname -m)"
                echo "/opt/homebrew/bin/brew（arm64）: $(ls -l /opt/homebrew/bin/brew 2>&1 || true)"
                echo "/usr/local        :"; ls -la /usr/local 2>&1 | head -20 || true
                echo "/usr/local/bin    :"; ls -la /usr/local/bin 2>&1 | head -20 || true
                exit 1
              fi
              # 安装 mpv（不再用 `|| true` 静默吞错）：显式记录退出码，
              # 随后以实际产物（brew --prefix 与 lib 目录）为准校验，校验不过才失败
              set +e
              /usr/local/bin/brew install mpv
              BREW_MPV_CODE=$?
              set -e
              echo "brew install mpv 退出码: $BREW_MPV_CODE"
              if [ "$BREW_MPV_CODE" -ne 0 ]; then
                echo "WARNING: brew install mpv 非零退出（已显式记录，不再静默忽略）；继续按实际产物校验"
              fi
              X86_MPV_PREFIX="$(/usr/local/bin/brew --prefix mpv 2>/dev/null || true)"
              if [ -z "$X86_MPV_PREFIX" ] || [ ! -d "$X86_MPV_PREFIX/lib" ]; then
                echo "ERROR: mpv x86_64 安装失败，未找到 mpv 前缀或 lib 目录"
                echo "=== 诊断 ==="
                echo "brew --prefix mpv    : ${X86_MPV_PREFIX:-<空>}"
                echo "brew --version       : $(/usr/local/bin/brew --version 2>&1 | head -1 || true)"
                echo "brew list --versions : $(/usr/local/bin/brew list --versions mpv 2>&1 | head -3 || true)"
                echo "brew config          : $(/usr/local/bin/brew config 2>&1 | grep -E 'HOMEBREW_PREFIX|HOMEBREW_PROCESSOR' | head -5 || true)"
                exit 1
              fi
              cp "$X86_MPV_PREFIX"/lib/libmpv*.dylib build/mpv/ 2>/dev/null || true
              for lib in build/mpv/libmpv*.dylib; do
                [ -f "$lib" ] || continue
                copy_dylibs_recursive "$lib" "build/mpv"
              done
              if ! ls build/mpv/libmpv*.dylib >/dev/null 2>&1; then
                echo "ERROR: 未从 x86_64 mpv 复制到任何 libmpv dylib"
                echo "=== build/mpv ==="; ls -la build/mpv/ 2>&1 | head -20 || true
                exit 1
              fi
              fix_macos_rpaths "build/mpv"
              sign_macos_macho_dir "build/mpv"
              verify_macos_macho_dir "build/mpv"
              echo "libmpv macOS x64 prepared"
              echo "=== build/mpv directory ==="
              ls -la build/mpv/ | head -30
              ;;
            *:ubuntu-*)
              # Linux: 只打包 libmpv.so 本身作为 fallback（不打包 libav* 等依赖）。
              # 运行时优先使用系统 libmpv，wrapper 脚本通过 LD_LIBRARY_PATH 确保
              # 系统完整版 libav* 优先于 Electron 裁剪版 libffmpeg 被加载。
              sudo apt-get update
              sudo apt-get install -y libmpv-dev
              # 查找 libmpv.so
              LIBMPV=$(find /usr/lib -name "libmpv.so*" -not -type l | head -1)
              if [ -z "$LIBMPV" ]; then
                LIBMPV=$(find /usr/lib -name "libmpv.so*" | head -1)
              fi
              if [ -n "$LIBMPV" ]; then
                cp "$LIBMPV" build/mpv/
                # 创建符号链接
                LIBMPV_NAME=$(basename "$LIBMPV")
                if [ "$LIBMPV_NAME" != "libmpv.so" ]; then
                  ln -sf "$LIBMPV_NAME" build/mpv/libmpv.so
                fi
                if [ "$LIBMPV_NAME" != "libmpv.so.2" ]; then
                  ln -sf "$LIBMPV_NAME" build/mpv/libmpv.so.2
                fi
              fi
              echo "libmpv Linux prepared (system deps not bundled)"
              ;;
            *:windows-*)
              # Windows: 从 zhongfly 预编译构建下载 libmpv 运行库。
              # 优先使用非 LGPL dev 包；若上游只提供 LGPL/dev 或资产名调整，则回退到可用包，
              # 但必须在解压后找到 libmpv-2.dll/mpv-2.dll，否则立即失败，避免产出不可播放的安装包。
              # 根据 runner.arch 决定下载 x64 还是 arm64
              if [ "${{ runner.arch }}" = "ARM64" ]; then
                export MPV_ARCH_FILTER="aarch64"
              else
                export MPV_ARCH_FILTER="x86_64"
              fi

              RELEASES_JSON="/tmp/mpv-winbuild-releases.json"
              # CI 失败修复（第 2 项）：不带 token 的 GitHub API 会命中匿名限流
              # （实测 Windows-x64 腿返回 403），改用 GITHUB_TOKEN 走高配额通道。
              # W-9：密钥经 `env:` 传入，不直接插值进 `run:` 脚本正文
              # （GitHub 官方建议；虽会被日志掩码，但插值进命令文本仍属不必要的暴露面）。
              curl -fsSL \
                -H "Authorization: Bearer $MPV_RELEASES_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/zhongfly/mpv-winbuild/releases?per_page=20" \
                -o "$RELEASES_JSON"
              DOWNLOAD_URL=$(python3 - "$RELEASES_JSON" <<'PY'
          import json
          import os
          import sys

          releases_path = sys.argv[1]
          arch = os.environ["MPV_ARCH_FILTER"].lower()

          with open(releases_path, encoding="utf-8") as f:
              payload = json.load(f)

          releases = payload if isinstance(payload, list) else [payload]

          def asset_name(asset):
              return str(asset.get("name", "")).lower()

          def is_archive(asset):
              name = asset_name(asset)
              return name.endswith((".7z", ".zip"))

          def is_candidate(asset):
              name = asset_name(asset)
              return (
                  is_archive(asset)
                  and arch in name
                  and "mpv" in name
                  and "ffmpeg" not in name
                  and asset.get("browser_download_url")
              )

          def choose(base, predicate):
              matches = [asset for asset in base if predicate(asset_name(asset))]
              return matches[0] if matches else None

          scanned = []
          selected = None
          selected_release = None
          for release in releases:
              assets = release.get("assets", []) if isinstance(release, dict) else []
              release_name = release.get("tag_name") or release.get("name") or "(unknown release)"
              scanned.append((release_name, [asset.get("name", "") for asset in assets]))
              base = [asset for asset in assets if is_candidate(asset)]
              selected = (
                  choose(base, lambda name: "dev" in name and "lgpl" not in name)
                  or choose(base, lambda name: "dev" in name)
                  or choose(base, lambda name: "libmpv" in name and "lgpl" not in name)
                  or choose(base, lambda name: "libmpv" in name)
                  or choose(
                      base,
                      lambda name: "lgpl" not in name
                      and "debug" not in name
                      and "symbol" not in name
                      and "source" not in name
                      and "src" not in name,
                  )
                  or choose(
                      base,
                      lambda name: "debug" not in name
                      and "symbol" not in name
                      and "source" not in name
                      and "src" not in name,
                  )
              )
              if selected:
                  selected_release = release_name
                  break

          if not selected:
              print(f"ERROR: no usable mpv Windows asset found for {arch}. Scanned releases:", file=sys.stderr)
              for release_name, asset_names in scanned:
                  print(f"  {release_name}:", file=sys.stderr)
                  for name in asset_names:
                      print(f"    - {name}", file=sys.stderr)
              sys.exit(1)

          print(f"Selected mpv asset: {selected.get('name', '')} from {selected_release}", file=sys.stderr)
          print(selected["browser_download_url"])
          PY
              )

              echo "Downloading mpv ${MPV_ARCH_FILTER} package from: $DOWNLOAD_URL"
              curl -fL -o /tmp/mpv-winbuild.7z "$DOWNLOAD_URL"
              7z x /tmp/mpv-winbuild.7z -o"/tmp/mpv-winbuild-extract" -y
              find /tmp/mpv-winbuild-extract -name "*.dll" -exec cp {} build/mpv/ \;

              if [ ! -f "build/mpv/libmpv-2.dll" ] && [ ! -f "build/mpv/mpv-2.dll" ]; then
                echo "ERROR: libmpv DLL not found after extracting mpv Windows package"
                echo "=== extracted DLLs ==="
                find /tmp/mpv-winbuild-extract -name "*.dll" -print
                exit 1
              fi

              dll_count=$(find build/mpv -maxdepth 1 -name "*.dll" | wc -l | tr -d ' ')
              echo "libmpv Windows ${MPV_ARCH_FILTER} prepared (${dll_count} DLLs)"
              ;;
          esac

          echo "=== mpv build directory ==="
          ls -la build/mpv/

      - name: Setup Node.js for unit tests
        # CI 失败修复（第 1 项）：`pnpm test` 直接执行 `.ts`
        # （`node --test tests/*.test.ts`），需要 Node >= 22.18 的原生 TypeScript 支持；
        # 在 Node 20 上会抛 ERR_UNKNOWN_FILE_EXTENSION: Unknown file extension ".ts"。
        # 只在测试步骤前后切换版本，打包链路继续使用上面已确定的 Node 20（已验证组合）。
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run unit tests
        # 位置说明：必须放在原生模块与 libmpv 就位之后、打包之前。
        # tests/native-engine-options.test.ts 会在 addon/libmpv 缺失时自动跳过，
        # 只有在此处运行才能真正执行「选项真实到达 libmpv」的端到端断言。
        shell: bash
        run: pnpm test

      - name: Run lint
        # lint 接入 CI（v1.2.3）：此前 lint 只在本地手工跑，且 `lint` 脚本带 --fix
        # 会自动改写工作区，不适合 CI。现脚本已去掉 --fix，本步骤只做「检查」：
        # 一旦有 error/warning 即失败。基线已固定为 0 error / 0 warning。
        # 本地需要自动修复时用：pnpm exec eslint . --ext .vue,.js,.ts,.jsx,.tsx --fix
        shell: bash
        run: pnpm lint

      - name: Run type check
        # V4-02（v1.4.0）：把类型检查**从 Build desktop app 里拆出来独立成步**。
        #
        # 为什么：此前 `Build desktop app` 的执行体是
        #   `pnpm exec vue-tsc --noEmit && pnpm exec vite build` 后接 electron-builder。
        # 因为 `&&` 短路，类型非 0 → 不执行 vite build → dist-electron 为空 →
        # electron-builder 报「entry file ... is corrupted/not found」。
        # **症状指向产物、根因是类型，隔了两层**，定位成本很高（见项目记忆）。
        #
        # 拆成独立步骤后失败归属清晰。`Build desktop app` 里那句**刻意保留**，
        # 以保持本地 `pnpm build` 的行为完全不变。
        shell: bash
        run: pnpm exec vue-tsc --noEmit

      - name: Restore Node.js for packaging
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Build desktop app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          pnpm exec vue-tsc --noEmit && pnpm exec vite build
          pnpm exec electron-builder ${{ matrix.electron_builder_args }} --publish never

      - name: Check first-screen bundle size
        # V4-03（v1.4.0）：把首屏体积守卫**接进 CI**。
        #
        # 为什么必须放在这里：`tests/bundle-size-guard.test.ts` 在 `Run unit tests`
        # 阶段必然 **skip**（单测早于构建，拿不到 dist/），所以那个用例在 CI 里
        # 一直是「未校验」。真正把关只能靠本步骤的 CLI —— 它读 dist/index.html，
        # **没有产物就是失败**（与单测里的 skip 语义刻意不同）。
        #
        # 位置必须 **在 Build desktop app 之后**：它依赖 dist/index.html。
        shell: bash
        run: node scripts/check-bundle-size.mjs

      - name: Check native addon freshness
        # V4-01（v1.4.0）：断言 4 个 `.node` 的 mtime **不早于**其 `.rs`/`Cargo.toml`。
        #
        # 它防的形态：`.node` 在 .gitignore 里、而 `cargo` 在本机长期跑不通，
        # 于是出现过「产物 09-25、源码 09-27」——`verify.ps1 -SkipNative` 报的「全绿」
        # 是在**旧二进制**上取得的。CI 每次全新编译，本步骤是对「构建产物确实来自
        # 当前源码」的显式确认。
        #
        # 产物缺失时脚本会 skip 并**显式标注未校验**（不静默通过）；本步骤排在
        # 四个 addon 构建之后，故此处必然有产物。
        shell: bash
        run: node scripts/check-native-freshness.mjs

      - name: Setup Node.js for GUI smoke
        # V4-05（v1.4.0）：GUI 冒烟脚本用 **Node 24**，因为它依赖全局 `WebSocket`
        # 直连 CDP（`--remote-debugging-port`）。
        #
        # ⚠️ 这个全局对象**只有 Node ≥ 22 才有**。本步骤排在
        # `Restore Node.js for packaging`（Node 20）之后，所以必须显式切回 24 ——
        # 否则脚本会以 `ReferenceError: WebSocket is not defined` 失败。
        # **首次干跑就是这么红的**：macOS-arm64 / macOS-x64 / Windows-arm64 /
        # Windows-x64 四腿均如此（Linux-x64 的 GUI 冒烟排在 Node 24 段所以通过）。
        #
        # `if` 必须与下面实际会执行的 GUI 冒烟步骤条件一致：
        # Linux 那条在 v1.4.2 已**重新启用**（根因是「未打包路径跳过了 LD_PRELOAD 修复」，
        # 已由 `YANMUSIC_SMOKE` 开关修正），所以这里也要覆盖 Linux。
        if: runner.os != 'Linux' || matrix.electron_builder_args == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: GUI smoke test (Linux, xvfb)
        # V4-05（v1.4.0）：**真的启动应用**并断言首屏渲染出来了。
        #
        # 这是长期缺口的补上（KNOWN-DEBT「缺端到端冒烟」）：v1.2.4 的线上事故是
        # 「安装包装完主进程启动即崩」，而**当时 CI 全绿** —— 因为没有任何一步
        # 真的启动过应用。已有的 smoke-main-bundle.cjs 只覆盖模块顶层求值（stub 掉
        # electron 后 require bundle），**没有窗口、没有渲染层**。
        #
        # 用 xvfb 提供虚拟显示器。断言是**结构化**的（窗口页面存在 + #app 已挂载 +
        # 首屏有文本 + 无 fatal 日志），刻意**不做像素比对** —— 那在 CI 上必然 flaky
        # 且失败时无法定位。
        #
        # ⚠️ **v1.4.2 重新启用了本步骤。** 它此前是 `if: false`，原因写在下方（保留原记录）。
        #
        # ## 原来为什么停用（v1.4.0）
        #
        #   Linux-x64 跑出：应用能启动、主进程日志推进到
        #   `[MpvController] Native audio options applied`，紧接着
        #   `libavutil: 56.70.100 -> 60.31.100` 然后 **SIGABRT**，始终没创建主窗口。
        #
        # ## 根因（v1.4.2 取证，三层）
        #
        #   ① `src/main/mpv/path.ts` 在 Linux 上**刻意优先用系统 libmpv**
        #      （`preferSystem = true`；`deb` 也声明 `libmpv2 | libmpv1`）；
        #   ② 系统 libmpv 依赖 libavutil **60**，而 Electron 内置的是裁剪版 **56**
        #      → 原生 addon 检测到不一致后**主动 abort**（那句版本号就是它打的）；
        #   ③ `ensureLinuxMpvEnv()` 本该用 `LD_PRELOAD` 消除该不一致，但原先有
        #      `if (!app.isPackaged) return true;`，而 **CI 跑的是未打包的 `electron .`**
        #      ⇒ 修复**根本没执行**。
        #
        #   ⇒ 结论：**冒烟覆盖的路径与打包路径不一致**，并非「所有 Linux 用户都启动不了」。
        #     所以修法不是放宽 `app.isPackaged` 的语义，而是让 env-fix 在**显式冒烟标志**
        #     （`YANMUSIC_SMOKE=1`，由 `scripts/smoke-gui.cjs` 设置）下也生效
        #     —— 使冒烟测的就是打包路径实际走的那条链。
        #
        # 断言是**结构化**的（窗口页面存在 + #app 已挂载 + 首屏有文本 + 无 fatal 日志），
        # 刻意**不做像素比对** —— 那在 CI 上必然 flaky 且失败时无法定位。
        if: runner.os == 'Linux' && matrix.electron_builder_args == ''
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" node scripts/smoke-gui.cjs

      - name: GUI smoke test (Windows/macOS)
        # V4-06（v1.4.0）：Windows / macOS runner 自带交互式桌面，无需 xvfb。
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/smoke-gui.cjs

      - name: Upload GUI smoke artifacts
        # 失败时把截图与日志带出来 —— 冒烟失败最怕的是「只告诉你红了」。
        #
        # ⚠️ 路径必须是**系统临时目录**，不是仓库里的目录。
        # v1.4.0 首发 Release 踩过一次真实事故：冒烟原先把截图写进仓库内的
        # `smoke-artifacts/`，结果那个文件**被当成 Release 产物发布了**
        # （该版本多了第 23 个附件，而约定是 22 个；内容还是第一次冒烟失败的画面）。
        # 现在 `scripts/smoke-gui.cjs` 写到 `os.tmpdir()/yanmusic-smoke-artifacts`。
        #
        # ⚠️ 这里**不能用 `${{ runner.temp }}`**：runner 的 temp 与进程里
        # `os.tmpdir()` 的实际取值在 Linux 上并不一致（后者通常是 `/tmp`）。
        # `/tmp` 在 Linux/macOS 上就是 `os.tmpdir()` 的取值；
        # Windows 上 `os.tmpdir()` 是 `%LOCALAPPDATA%\Temp`，而 upload-artifact
        # 的 `path` 在 Windows 上会解析 `/tmp` 失败 —— 故加一行兜底路径。
        # `if-no-files-found: ignore` 让「没截图」不导致本步骤失败。
        # **不要改回仓库内路径。**
        #
        # ⚠️ 主版本必须与本文件「Upload build artifacts」保持一致（v7.0.2）：
        # 该处注释已写明 upload@v7 与 download@v8 共用同一 artifact 客户端库，
        # 跨大版本不兼容。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-${{ matrix.artifact_name }}
          path: |
            /tmp/yanmusic-smoke-artifacts/
            ${{ runner.temp }}/yanmusic-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test main process bundle
        # v1.2.4 线上事故后新增：安装包装完主进程启动即崩
        # （TypeError: <minified> is not a function），但 CI 当时全绿 ——
        # 因为没有任何一步真的「启动」过主进程，只校验了产物存在。
        #
        # 本步骤不依赖 GUI/xvfb：它用 stub 替换 `electron` 后 require 主进程
        # bundle，断言「模块顶层求值阶段」不抛错 —— 事故正是发生在那里。
        # 同时校验主进程为单文件（多 chunk 是崩溃的构建侧特征）。
        shell: bash
        run: node scripts/smoke-main-bundle.cjs

      - name: Create Arch Linux package alias
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for package_path in release/YanMusic-*.pacman; do
            cp "$package_path" "${package_path%.pacman}.pkg.tar.zst"
          done

      - name: Verify bundled Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e

          if [ "${{ runner.arch }}" = "ARM64" ]; then
            app_exe="release/win-arm64-unpacked/YanMusic.exe"
          else
            app_exe="release/win-unpacked/YanMusic.exe"
          fi

          if [ ! -f "$app_exe" ]; then
            echo "ERROR: bundled app executable not found: $app_exe"
            echo "=== release directories ==="
            find release -maxdepth 2 -type d -print
            echo "=== executable files ==="
            find release -maxdepth 3 -type f -name '*.exe' -print
            exit 1
          fi

          app_dir=$(dirname "$app_exe")
          mpv_dir="$app_dir/resources/mpv"
          if [ ! -f "$mpv_dir/libmpv-2.dll" ] && [ ! -f "$mpv_dir/mpv-2.dll" ]; then
            echo "ERROR: bundled libmpv DLL not found in $mpv_dir"
            echo "=== bundled resources ==="
            find "$app_dir/resources" -maxdepth 3 -print
            exit 1
          fi

          echo "bundled libmpv DLL found in $mpv_dir"

      - name: Verify bundled macOS mpv signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e

          app_path=$(find release -maxdepth 3 -type d -name 'YanMusic.app' | head -n 1)
          if [ -z "$app_path" ]; then
            echo "ERROR: YanMusic.app not found in release output"
            find release -maxdepth 3 -print
            exit 1
          fi

          mpv_dir="$app_path/Contents/Resources/mpv"
          if [ ! -d "$mpv_dir" ]; then
            echo "ERROR: bundled mpv directory not found: $mpv_dir"
            exit 1
          fi

          verified_count=0
          while IFS= read -r -d '' file_path; do
            if file "$file_path" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$file_path"
              verified_count=$((verified_count + 1))
            fi
          done < <(find "$mpv_dir" -type f -print0)

          echo "verified $verified_count bundled mpv Mach-O signatures in $mpv_dir"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release Assets
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        # 必须与 upload-artifact 的主版本配套：二者共用 artifact 客户端库
        # （upload-artifact@v7 依赖 @actions/artifact ^6.2.0，download-artifact@v4 仍是 ^2.3.2，
        #  跨大版本不兼容 → 会让 release 作业下载产物失败）。v8.0.1 依赖 ^6.2.1，与 v7 同线。
        # ⚠️ v8.0.2 与 v7.0.2 仍同线（v1.4.1 一并升级）—— 这两个 bump **必须同时应用**，
        #    否则就会出现上面那种跨线不兼容。这条约束刻意留在看得见的地方。
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find release-artifacts -maxdepth 2 -type f | sort

      - name: Check release artifact manifest
        # v1.4.1（R-2）：发布产物**清单守卫** —— 这是 v1.4.0 发布事故补上的最后一道网。
        #
        # 事故：v1.4.0 的 Release 多出了第 23 个附件 `first-screen.png`
        # （内容还是第一次冒烟失败的画面）。根因（冒烟截图写进仓库内的
        # `smoke-artifacts/`，被 electron-builder 的 release/ glob 扫到）已修，
        # 但当时**没有任何守卫拦住它** —— 是人工比对产物清单才发现的（22 → 23）。
        #
        # 本步骤断言**精确清单**（22 项：18 个平台产物 + 4 个自动更新元数据），
        # 多一个或少一个都在**建 Release 之前**失败。
        # 版本号从 `GITHUB_REF_NAME` 读取，故发新版**不需要改清单**。
        #
        # 位置必须在 `Download all build artifacts` 之后、`Create Release` 之前。
        shell: bash
        run: node scripts/check-release-artifacts.mjs release-artifacts --version="${GITHUB_REF_NAME}"

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取顶部声明（## 之前的内容，去掉标题行）
          HEADER=$(awk '/^## \[/ { exit } !/^# / { print }' CHANGELOG.md | sed '/^$/d')
          # 提取对应版本的内容
          VERSION_BODY=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -n "$HEADER" ] && [ -n "$VERSION_BODY" ]; then
            BODY=$(printf '%s\n\n%s' "$HEADER" "$VERSION_BODY")
          elif [ -n "$VERSION_BODY" ]; then
            BODY="$VERSION_BODY"
          else
            BODY="详见 CHANGELOG.md"
          fi

          {
            echo "BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.x（SHA 为准，见 tests/ci-supply-chain.test.ts）
        with:
          # 显式设置标题，与项目约定一致（`YanMusic vX.Y.Z Release`）。
          # 此前未设置，GitHub 默认以 tag 名作标题，导致每次发布后都要手工
          # `gh release edit --title`（见 docs/release-process.md §6）。
          # 这里直接用 ref_name 拼出目标标题，消除该手工步骤。
          name: YanMusic ${{ github.ref_name }} Release
          files: release-artifacts/**
          body: ${{ steps.changelog.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Send Telegram Notification
    if: startsWith(github.ref, 'refs/tags/') && success()
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build changelog
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found && NF { print }
          ' CHANGELOG.md \
            | sed 's/^### /\n📌 /' \
            | sed 's/^- /• /' \
            | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g' \
            | awk 'NR==1{printf "%s",$0;next}{printf "\n%s",$0}')

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="详见 CHANGELOG.md"
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build artifact links from release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          ASSETS=$(gh api "repos/${REPO}/releases/tags/${VERSION}" --jq '.assets[].name' 2>/dev/null || true)
          if [ -z "$ASSETS" ]; then
            echo "ARTIFACT_LINKS=无" >> "$GITHUB_ENV"
            exit 0
          fi

          LINKS=""
          while IFS= read -r filename; do
            escaped_name=$(printf '%s' "$filename" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            link="https://github.com/${REPO}/releases/download/${VERSION}/${filename}"
            if [ -z "$LINKS" ]; then
              LINKS="• <a href=\"${link}\">${escaped_name}</a>"
            else
              LINKS="${LINKS}\n• <a href=\"${link}\">${escaped_name}</a>"
            fi
          done <<< "$ASSETS"

          {
            echo "ARTIFACT_LINKS<<EOF"
            printf '%b\n' "$LINKS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send Telegram message
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are missing, skip notification."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          printf -v MESSAGE '%s\n\n%s\n%s\n\n%s\n%s\n\n%s' \
            "🎉 <b>YanMusic ${VERSION} 构建成功！</b>" \
            "📝 <b>更新内容：</b>" \
            "${CHANGELOG}" \
            "📦 <b>下载地址：</b>" \
            "${ARTIFACT_LINKS}" \
            "🔗 <a href=\"https://github.com/${REPO}/releases/tag/${VERSION}\">查看完整 Release</a>"

          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            --arg parse_mode "HTML" \
            '{chat_id: $chat_id, text: $text, parse_mode: $parse_mode, disable_web_page_preview: true}')

          if [ -n "$TELEGRAM_TOPIC_ID" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg topic_id "$TELEGRAM_TOPIC_ID" '. + {message_thread_id: ($topic_id | tonumber)}')
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  notify-qq:
    name: Send QQ Group Notification
    if: startsWith(github.ref, 'refs/tags/') && success()
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build changelog
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found && NF { print }
          ' CHANGELOG.md \
            | sed 's/^### /\n📌 /' \
            | sed 's/^- /• /' \
            | awk 'NR==1{printf "%s",$0;next}{printf "\n%s",$0}')

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="详见 CHANGELOG.md"
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build artifact links
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          ASSETS=$(gh api "repos/${REPO}/releases/tags/${VERSION}" --jq '.assets[].name' 2>/dev/null || true)
          if [ -z "$ASSETS" ]; then
            echo "QQ_ARTIFACT_LINKS=无" >> "$GITHUB_ENV"
            exit 0
          fi

          LINKS=""
          while IFS= read -r filename; do
            link="https://github.com/${REPO}/releases/download/${VERSION}/${filename}"
            if [ -z "$LINKS" ]; then
              LINKS="• ${filename}\n  ${link}"
            else
              LINKS="${LINKS}\n• ${filename}\n  ${link}"
            fi
          done <<< "$ASSETS"

          {
            echo "QQ_ARTIFACT_LINKS<<EOF"
            printf '%b\n' "$LINKS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send QQ group message via OneBot API
        shell: bash
        env:
          QQ_BOT_API: ${{ secrets.QQ_BOT_API }}
          QQ_GROUP_ID: ${{ secrets.QQ_GROUP_ID }}
          QQ_BOT_TOKEN: ${{ secrets.QQ_BOT_TOKEN }}
        run: |
          set -e
          if [ -z "$QQ_BOT_API" ] || [ -z "$QQ_GROUP_ID" ]; then
            echo "QQ Bot secrets are missing, skip QQ notification."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          MESSAGE=$(printf '🎉 YanMusic %s 发布啦！\n\n📝 更新内容：\n%s\n\n📦 下载地址：\n%s\n\n🔗 查看完整 Release：https://github.com/%s/releases/tag/%s' \
            "$VERSION" "$CHANGELOG" "$QQ_ARTIFACT_LINKS" "$REPO" "$VERSION")

          HEADERS=(-H "Content-Type: application/json")
          if [ -n "$QQ_BOT_TOKEN" ]; then
            HEADERS+=(-H "Authorization: Bearer ${QQ_BOT_TOKEN}")
          fi

          PAYLOAD=$(jq -n \
            --arg group_id "$QQ_GROUP_ID" \
            --arg message "$MESSAGE" \
            '{message_type: "group", group_id: $group_id, message: $message}')

          curl -sS -X POST "${QQ_BOT_API}/send_msg" \
            "${HEADERS[@]}" \
            -d "$PAYLOAD"
